<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.css">
</head>
<body class="bg-secondary">

    <h1>Images</h1>
    <img class="rounded" src="images.jfif" alt="">
    <img class="rounded-top" src="images.jfif" alt="">
    <img class="rounded-bottom" src="images.jfif" alt="">
    <img class="rounded-circle" src="images.jfif" alt="">
    <img class="rounded-circle img-thumbnail" src="images.jfif" alt="">
    <hr>
    <img src="images.jfif" class="d-block mx-auto" alt="">

    <img src="images.jfif" class="float-end" alt="">
    <img src="images.jfif" class="float-start" alt="">
    <hr>

    <h1>Card</h1>
    <div class="card w-25">
        <div class="card-header">
            <img src="images.jfif" alt="" class="card-img-top">
        </div>
        <div class="card-body">
            <h2>Wallpaper</h2>
            <p>Lorem ipsum dolor sit amet.</p>
            <p>5600</p>
        </div>
        <div class="card-footer">
            <button class="btn btn-primary">Add To Cart</button>
        </div>
    </div>

    <br>

    <div class="card w-25">

            <img src="images.jfif" alt="" class="card-img-top">

        <div class="card-body">
            <h2>Wallpaper</h2>
            <p>Lorem ipsum dolor sit amet.</p>
            <p>5600</p>
        </div>
        <div class="card-footer">
            <button class="btn btn-warning">Add To Cart</button>
            <button class="btn btn-primary">Buy Now</button>
        </div>
    </div>
</body>
</html>
