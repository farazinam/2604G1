<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
</head>
<body>
    <h1>Group Buttons</h1>

    <div class="btn-group btn-group-sm btn-group-vertical">
        <button class="btn btn-primary">Submit</button>
        <button class="btn btn-success">Submit</button>
        <button class="btn btn-warning">Submit</button>
    </div>

    <div class="btn-group btn-group-sm">
        <button class="btn btn-primary">Submit</button>
        <button class="btn btn-success">Submit</button>
        <button class="btn btn-warning">Submit</button>
    </div>

    <h1>Badges</h1>

    <span class="bg-success badge">This is a Badge</span> <br>
    Upto <span class="bg-primary badge"> 70% </span> off

    <h1>Alert</h1>

    <div class="alert alert-danger alert-dismissible fade show">
        Something went wrong. Please try again later. <a href="" class="alert-link">help</a>
        <button class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-warning alert-dismissible">
        Server Down. <a href="" class="alert-link">help</a>
        <button class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-success alert-dismissible">
        Form Submitted successfully. <a href="" class="alert-link">help</a>
        <button class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <h1>Table</h1>

    <table class="table table-primary table-hover table-striped table-borderless">
        <tr class="table-dark">
            <th>S No</th>
            <th>Name</th>
            <th>City</th>
            <th>Action</th>
        </tr>

        <tr class="table-warning">
            <td>1</td>
            <td class="table-success">Ali</td>
            <td>Karachi</td>
            <td> <button class="btn btn-danger">Delete</button> </td>
        </tr>

            <td>1</td>

            <td> <button class="btn btn-danger">Delete</button> </td>
        </tr>

        </tr>
    </table>


    <script src="bootstrap/js/bootstrap.js"></script>
</body>
</html>
