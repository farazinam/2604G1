<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.css">
</head>

<body>

    <div class="container">
        <div class="row">


            <div class="col col-lg-4">
                <form action="">
                    <label for="" class="form-label">Username</label>
                    <input type="text" class="form-control form-control-sm" placeholder="faraz">
                    <span class="form-text">Please provide name in Block letters</span> <br>
                    <button class="btn btn-primary m-2">Submit</button>
                </form>
            </div>


            <div class="col col-lg-4">
                <form action="">
                    <label for="" class="form-label">Email</label>
                    <input type="email" class="form-control" value="faraz@gmail.com" readonly disabled>
                    <label for="" class="form-label">Password</label>
                    <input type="password" class="form-control">
                    Skills
                    <div class="form-check">
                        <label for="">Video Editing</label>
                        <input type="checkbox" class="form-check-input">
                        <label for="">Programming</label>
                        <input type="checkbox" class="form-check-input">
                    </div>

                    Gender
                    <div class="form-check">
                        <label for="">Male</label>
                        <input type="radio" class="form-check-input" name="gender">
                    </div>
                    <div class="form-check">
                        <label for="">Female</label>
                        <input type="radio" class="form-check-input" name="gender">
                    </div>


                    <div class="form-check form-switch">
                        <label for="">Light/Dark Mode</label>
                        <input type="checkbox" class="form-check-input" checked>
                    </div>

                    <input type="range" class="form-range" step="10">

                    <button class="btn btn-primary m-2">Submit</button>
                </form>
            </div>



            <div class="col col-lg-4">
                <form action="">
                    <label for="" class="form-label">Username</label>
                    <input type="text" class="form-control form-control-lg">

                    <label for="" class="form-label">Email</label>
                    <input type="email" class="form-control form-control-lg" disabled>

                    <label for="" class="form-label">Password</label>
                    <input type="password" class="form-control form-control-lg form-control-plaintext">

                    <label for="" class="form-label">Gender</label>
                    <select class="form-select form-select-sm">
                        <option value="">Male</option>
                        <option value="">Female</option>
                    </select>
                    <button class="btn btn-primary m-2">Submit</button>
                </form>
            </div>



            <!-- Input Group -->
            <div class="col col-lg-4">
                <form action="">
                    <div class="input-group">
                        <label for="" class="input-group-text bg-dark text-white">Email</label>
                        <input type="text" class="form-control">
                    </div>
                </form>
            </div>

            <div class="col col-lg-4">
                <form action="">
                    <div class="input-group">
                        <label for="" class="input-group-text bg-warning">Email</label>
                        <input type="text" class="form-control">
                    </div>
                </form>
            </div>

            <div class="col col-lg-4">
                <form action="">

                    <!-- <div class="input-group">
                        <span for="" class="input-group-text bg-danger">
                            <input type="radio">
                        </span>
                        <input type="text" class="form-control">
                    </div> -->

                    <div class="input-group">
                        <span for="" class="input-group-text">
                            <button class="btn btn-primary">Submit</button>
                        </span>
                        <input type="text" class="form-control">
                    </div>

                    <div class="input-group">
                        <label for="" class="input-group-text bg-warning">
                            <input type="radio">
                        </label>
                        <input type="text" class="form-control form-control-lg">
                    </div>

                    <div class="input-group">
                        <label for="" class="input-group-text">
                            <input type="file">
                        </label>
                        <button type="submit" class="btn btn-primary">Submit</button>
                    </div>

                </form>
            </div>

            <div class="col col-lg-4">
                <form action="">
                    <div class="form-floating">
                        <input type="text" class="form-control" placeholder="">
                        <label for="" class="form-label">Name</label>
                    </div>
                </form>
            </div>

        </div>
    </div>
</body>

</html>
