            //Events

            //Mouse Events
            $("button").eq(0).click(function (){
                alert("You Clicked a Button!");
            });
            $("button").eq(0).dblclick(function (){
                alert("You Double Clicked a Button!");
            });
            $("button").eq(0).contextmenu(function (){
                alert("You Right Clicked a Button!");
            });
            $("button").eq(1).mouseenter(function (){
                alert("You Entered a Mouse to a Button!");
            });
            $("button").eq(1).mouseleave(function (){
                alert("You Leave a Mouse from a Button!");
            });

            //Keyboard Event
            $("button").eq(2).keydown(function (){
                console.log("You Key Down!");
            });
            $("button").eq(2).keyup(function (){
                console.log("You Key Up!");
            });
