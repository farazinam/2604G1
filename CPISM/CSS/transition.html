        /* Animation  */
        /* div{
            width: 100px;
            height: 100px;
            animation-name: myAnimation;
            animation-duration: 1s;
            animation-timing-function: ease-in-out;
            animation-delay: 1s;
            animation-iteration-count: infinite;

        @keyframes myAnimation {
            from {
                background-color: lightblue;
                width: 100px;
            }
            to{
                background-color: lightcoral;
                width: 150px;
            }
        }

        p{
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: lightgreen;

            animation: circleAnimation 1s ease-in-out 1s infinite;
        }

        @keyframes circleAnimation {
            0% {
                background-color: lightgreen;
                width: 50px;
                height: 50px;
            }
            25% {
                background-color: lightgray;
                width: 100px;
                height: 100px;
            }
            50% {
                background-color: lightcoral;
                width: 50px;
                height: 50px;
            }
            75% {
                background-color: lightblue;
                width: 100px;
                height: 100px;
            }
            100% {
                background-color: lightseagreen;
                width: 50px;
                height: 50px;
            }
        }

        span{
            display: block;
            width: 100px;
            height: 100px;
            background-color: lightblue;

            position: absolute;
            left: 0;
            top: 0;

            animation: recAnimation 5s ease-in 0s infinite;
        }

        @keyframes recAnimation {
            0%{
            left: 0;
            top: 0;
            }
            25%{
            left: 600px;
            top: 0;
            background-color: lightcoral;
            border-radius: 50%;
            }
            50%{
            left: 600px;
            top: 400px;
            background-color: lightgreen;
            border-radius: 0%;
            }
            75%{
            left: 0;
            top: 400px;
            background-color: lightseagreen;
            border-radius: 50%;
            }
            100%{
            left: 0;
            top: 0;
            }
        }




        
    </style>
</head>
