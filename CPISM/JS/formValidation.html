<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        span{
            color: red;
        }
    </style>
</head>
<body>
    <h1>Student Registration Form</h1>

    <form onsubmit="getRecord()">
        <label for="">Name</label>
        <input type="text"> <br>
        <span></span> <br>

        <label for="">Email</label>
        <input type="email"> <br>
        <span></span> <br>

        <label for="">Contact No</label>
        <input type="text"> <br>
        <span></span> <br>

        <label for="">Address</label>
        <input type="text"> <br>
        <span></span> <br>

        <button type="submit"> Register </button>
    </form>


    <script>
        function getRecord(){
            event.preventDefault();

            //Input Values
            var name = document.getElementsByTagName("input")[0].value;
            var email = document.getElementsByTagName("input")[1].value;
            var contact = document.getElementsByTagName("input")[2].value;
            var address = document.getElementsByTagName("input")[3].value;

            //Error Showing Elements
            var nameError = document.getElementsByTagName("span")[0];
            var emailError = document.getElementsByTagName("span")[1];
            var contactError = document.getElementsByTagName("span")[2];

            //Patterns
            var namePattern = /^[a-zA-Z]{3,}$/;
            var contactPattern = /^[0-9]{11}$/;
            var emailPattern = /^[a-zA-Z._%+-]+@[a-zA-Z0-9.-]+\.[a-zA-Z]{3,}$/;

            //name validation
            if(name == ""){
                nameError.innerHTML = "Name is Required";
            }
            else if(!namePattern.test(name)){
               nameError.innerHTML = "Please Provide Valid Name";
            }

            //email validation
            else if(email == ""){
                emailError.innerHTML = "Email is Required";
                nameError.innerHTML = "";
            }
            else if(!emailPattern.test(email)){
               emailError.innerHTML = "Please Provide Valid Email";
               nameError.innerHTML = "";
            }

            //contact validation
            else if(contact == ""){
                contactError.innerHTML = "Contact is Required";
                emailError.innerHTML = "";
                
            }
            else if(!contactPattern.test(contact)){
                contactError.innerHTML = "Contact Number Should contain 11 digits";
                emailError.innerHTML = "";
            }

            else{
                alert("Form Submitted Successfully!")
            }
        }
    </script>
</body>
</html>
