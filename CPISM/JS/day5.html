    <script>
        //break
        for(var i = 1; i <= 10; i++){
            if(i == 7){
                break;
            }
            document.write(i)
        }

        document.write("<hr>")

        //continue
        for(var i = 1; i <= 10; i++){
            if(i == 7){
                continue;
            }
            document.write(i)
        }

        document.write("<hr>")

        // odd numbers
        for(var i = 1; i <= 10; i++){
            if(i % 2 == 0){
                continue;
            }
            document.write(i)
        }

        document.write("<hr>")

        // even numbers
        for(var i = 1; i <= 10; i++){
