<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        p{
            color: lightslategray;
        }
    </style>
</head>
<body>
    <h1>Student Registration Form</h1>

    <form onsubmit="getRecord()">
        <label for="">Name</label>
        <input type="text"> <br>

        <label for="">Email</label>
        <input type="email"> <br>

        <label for="">Contact No</label>
        <input type="text"> <br>

        <label for="">Address</label>
        <input type="text"> <br>

        <button type="submit"> Register </button>
    </form>

    <hr>

    <h2 style="color: green;"></h2>

    <p></p>
    <p></p>
    <p></p>
    <p></p>

    <script>
        function getRecord(){
            event.preventDefault();

            var name = document.getElementsByTagName("input")[0].value;
            var email = document.getElementsByTagName("input")[1].value;
            var contact = document.getElementsByTagName("input")[2].value;
            var address = document.getElementsByTagName("input")[3].value;

            var setName = document.getElementsByTagName("p")[0];
            var setEmail = document.getElementsByTagName("p")[1];
            var setContact = document.getElementsByTagName("p")[2];
            var setAddress = document.getElementsByTagName("p")[3];

            var setHeading = document.getElementsByTagName("h2")[0];

            setHeading.innerHTML = "Form Submitted Successfully"

            setName.innerHTML = "Name:" + name;
            setEmail.innerHTML = "Email:" + email;
            setContact.innerHTML = "Contact No:" + contact;
            setAddress.innerHTML = "Address:" + address;
        }
    </script>
</body>
</html>
